<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* SVG Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .animated-bg-circle { animation: pulse-glow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float-node 5s ease-in-out infinite; }
    .floating-card-2 { animation: float-node 7s ease-in-out infinite 1s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-gradient)"/>

  <!-- Dynamic / Animated Background Orbs -->
  <circle class="animated-bg-circle" cx="150" cy="100" r="180" fill="url(#primary-glow)"/>
  <circle class="animated-bg-circle" cx="1050" cy="250" r="220" fill="url(#primary-glow)" style="animation-delay: -3s;"/>

  <!-- Decorative Low-Code Grid & Flow Nodes in Background -->
  <g opacity="0.25">
    <path d="M 100,280 L 300,280 L 400,220" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,6" fill="none"/>
    <path d="M 800,100 L 950,100 L 1050,180" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,6" fill="none"/>
    <circle cx="300" cy="280" r="6" fill="#a855f7"/>
    <circle cx="950" cy="100" r="6" fill="#06b6d4"/>
  </g>

  <!-- Background Decorative Code Nodes -->
  <g class="floating-card-1" transform="translate(860, 60)" opacity="0.4">
    <rect width="260" height="90" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="40" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="55" cy="25" r="5" fill="#10b981"/>
    <rect x="20" y="45" width="140" height="8" rx="4" fill="#38bdf8"/>
    <rect x="20" y="60" width="90" height="8" rx="4" fill="#a855f7"/>
  </g>

  <g class="floating-card-2" transform="translate(890, 180)" opacity="0.35">
    <rect width="230" height="80" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="20" y="25" width="100" height="8" rx="4" fill="#818cf8"/>
    <rect x="20" y="42" width="150" height="8" rx="4" fill="#34d399"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, and Subtitle -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="21" class="badge-text">⚡ ENTERPRISE AI &amp; LOW-CODE 2026</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="155" class="title" filter="url(#glow)">
      Enterprise Low-Code AI App Builder
    </text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="200" class="subtitle">
      Curated Directory of Commercial Platforms &amp; Open-Source AI Builders
    </text>

    <!-- Key Feature Pills (Foreground) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0">🧱 Internal Tools</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="175" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0">🤖 AI Agents &amp; RAG</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="185" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="16" y="23" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0">🔄 Workflows &amp; LLMOps</text>
      </g>
    </g>
  </g>
</svg>
